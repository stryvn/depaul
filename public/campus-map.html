const map=document.getElementById('map'),roads=document.getElementById('roads'),markers=document.getElementById('markers'),pin=document.getElementById('pin');
const plus=document.getElementById('plus'),minus=document.getElementById('minus'),home=document.getElementById('home'),scale=document.querySelector('.scale');
const labels=[['Rajamudy',487,263,'town'],['Pathinaramkandam',-459,-395,'town'],['Christuraj Church',558,325,'place'],['Mini Stadium',464,408,'place'],['Shiva Temple',-335,-327,'place'],['Rajamudy Bus Stop',463,298,'place'],['De Paul School Road',-2,56,'road-label'],['Upputhode–Rajamudi Road',203,658,'road-label'],['Karimban–Prakash Road',-741,598,'road-label'],['Kumarakom–Cumbammettu–Cumbam Road',-297,-170,'road-label'],['Community Health Centre',-1035,-386,'place'],['Puthakuzhykavala',42,1051,'town']].map(([text,x,y,style])=>{const label=document.createElement('span');label.className='marker '+style;label.textContent=text;markers.append(label);return {label,x,y,style};});
